name: ag-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ag-tests:
    name: ag-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - name: Scan changed files for sensitive information
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD^"
          fi
          python ag/tools/scan_sensitive.py --base "$base" --head HEAD
      - name: Install ag and chemistry dependencies
        run: python -m pip install -e "ag[test,chem]" rdkit
      - name: Test ag
        run: python -m pytest ag/tests
      - name: Test new Skills when present
        run: |
          if [[ -d skills-next ]] && [[ -n "$(find skills-next -type f -name 'test_*.py' -print -quit)" ]]; then
            python -m pytest skills-next
          fi
