# Local-only template. Replace every placeholder before use; never commit values.
# The old config.example.toml remains valid as the default PBS cluster.
# Optional explicit policy; configure only from the human's instruction.
# These study/cluster names are synthetic; wildcards are not supported.
# [approval.policies.validation]
# studies = ["water-validation", "butane-validation"]
# templates = ["gaussian", "crest"]
# clusters = ["default", "batch"]
# max_cores_per_job = 8
# max_walltime = "00:30:00"
# quote = "<verbatim human instruction defining this policy>"
# set_at = "2026-10-23T00:00:00+00:00"

[local]
python = "<absolute local Python executable>"
studies_root = "<absolute local studies directory outside Git>"

# Optional advice only. Names must already exist in this configuration.
# This synthetic example uses the entries defined below.
# [routing]
# gaussian = ["default", "batch"]  # also gaussian-cp and multiwfn
# crest = ["batch-test", "default"]  # also xtb, subject to allowed_templates
# [routing.studies."water-validation"]
# gaussian = ["default"]
# With all four intended entries configured, the owner's default orders are:
# gaussian: hpc3 -> newhpc -> default -> scnet
# crest: scnet-test -> default -> newhpc
# No routing table means status only, with no recommendation.
# This order is a local configuration choice, not a compiled-in fallback.
# Unsupported template/entry combinations are still excluded.

# Optional ladder: cells are evaluated in table order before prepare.
# These names and resources are synthetic examples, not a deployment plan.
# "empty" requires an empty single node; "free" requires at least the stated
# free cores AND enough remaining memory on that same node. Neither guarantees
# scheduler start time. The selected tier fixes both requested cores and memory.
# [[routing.ladder]]
# id = "available-default"
# cluster = "default"
# classes = ["main"]
# tier = "general"
# condition = "free"
# min_free_cores = 22
# max_placements = 1
#
# [[routing.ladder]]
# id = "batch-after-wakeup"
# cluster = "batch"
# classes = ["main"]
# tier = "complex"
# condition = "jobs"
# max_jobs = 4
# max_placements = 1
# A jobs cell also requires verified waiting across an actual wakeup. It does
# not accept a manually supplied "waited" or "approved" flag.
#
# [[routing.ladder]]
# id = "queue-default"
# cluster = "default"
# classes = ["main"]
# tier = "general"
# condition = "queue"
# max_placements = 1
# Fallback queues permit at most one per actual node/entry and two per run.
# Shared login aliases do not create additional queue places or core quotas.
#
# For a separately configured synthetic PBS targeting entry "compute", with
# allowed nodes "compute-a"/"compute-b" and an exact 48-core/96-GB max tier:
# [[routing.ladder]]
# id = "empty-compute"
# cluster = "compute"
# classes = ["main"]
# tier = "max"
# condition = "empty"
# nodes = ["compute-a", "compute-b"]
# node_fraction = "1/2"
# max_placements = 2
# Fractions are "1/2", "1/4", or "1" (whole node). Resource mapping must
# exactly match total slots and the configured tier; max_cores still applies.
# Small Gaussian cells use classes=["small"] and node_fraction="1/4" with
# matching tiers. Within an entry the router prefers occupied fitting nodes.
# Repeat queue cells in the desired fallback order; do not infer cross-cluster
# eligibility for a parent checkpoint. T184 record integration and T186 final
# submission checks must be validated before autonomous use.

[clusters.default]
scheduler = "pbs"
queue = "<PBS queue>"
# A Gaussian-only entry may set allowed_templates = ["gaussian"] here
# (also supports gaussian-cp), then omit the programs.xtb table below.
# Keep only the templates with real installations; never invent software paths.
# Omitting allowed_templates retains the full legacy program requirements.
# Optional, only after confirming the scheduler's timezone. Omit if unknown.
# 必须填 IANA 时区名，不要填固定偏移（例如 America/New_York 会随夏令时变化）。
scheduler_timezone = "Asia/Shanghai"
[clusters.default.ssh]
config_file = "<absolute SSH configuration file>"
host = "<PBS SSH alias>"
[clusters.default.remote]
allowed_root = "<absolute allowed root>"
ag_root = "<absolute allowed root>/ag"
[clusters.default.programs.gaussian]
g16root = "<absolute Gaussian executable directory>"
[clusters.default.programs.xtb]
root = "<absolute xtb and crest installation root>"
# Optional independent CREST executable; omit to use xtb root/bin/crest.
# [clusters.default.programs.crest]
# executable = "<absolute CREST executable>"
[clusters.default.resources]
# Optional prepare default, only from this entry's configured tiers.
# Explicit --tier wins; without either value prepare asks for --tier.
# default_tier = "simple"
# PBS-only, explicit owner authorization: integer 120..200 GB; omitted = 120.
# Each tier must fit this entry's ceiling and one eligible node with headroom.
# This is not scheduler/account permission; do not add this field to Slurm.
# pbs_max_mem_gb = 200
# Optional hard per-job walltime; omitted means no extra ag limit.
# A scheduler may still impose its own limit.
# max_walltime = "36:00:00"
# default MUST explicitly retain max_cores = 44 in local configuration.
# Per-job/tier cap: positive integer, no larger than one eligible node.
# Gaussian runs on one node; size for the smallest eligible node.
# Running + queued cap: integer >= max_cores; no four-times ceiling.
# ag does not limit concurrently running cores.
max_cores = 44
max_committed_cores = 88
# Optional examples only; replace with owner-approved limits.
# max_queued_cores = 66
# scheduler_max_running_cores = 22
# Queue caps include held jobs and applicable unobserved reservations.
# Matching entries share the smallest configured queue cap, even if omitted here.
# The running cap is enforced by the scheduler; ag has not verified it.
[clusters.default.resources.tiers.mini]
cores = 4
mem_gb = 10
[clusters.default.resources.tiers.simple]
cores = 8
mem_gb = 12
[clusters.default.resources.tiers.general]
cores = 22
mem_gb = 50
[clusters.default.resources.tiers.complex]
cores = 44
mem_gb = 120
# Optional clusters.default.resources.tiers.max / .ultra use cores and mem_gb.
# Unconfigured optional tiers are not offered for this entry.

[clusters.batch]
scheduler = "slurm"
# Entry names are local aliases. For SCNet use scnet (Gaussian) and scnet-test
# (CREST), after verifying 正式分区 / 赠送分区 respectively in local config.
# Optional; omit to use the site's scheduler defaults.
partition = "<partition>"
account = "<account>"
qos = "<qos>"
expires = "<YYYY-MM-DD>"
[clusters.batch.ssh]
config_file = "<absolute SSH configuration file>"
host = "<Slurm SSH alias>"
[clusters.batch.remote]
allowed_root = "<absolute allowed root>"
ag_root = "<absolute allowed root>/ag"
[clusters.batch.programs.gaussian]
g16root = "<absolute Gaussian executable directory>"
# Optional environment-module setup: only a source-file path and module names.
# Arbitrary shell text and scheduler extra flags are not supported.
module_init = "<absolute module initialization file>"
modules = ["<Gaussian module name>"]
# SCNet A.03: replace module_init/modules above with environment="scnet-a03".
# The fixed template preserves private scratch and avoids vendor telemetry writes.
[clusters.batch.programs.xtb]
root = "<absolute xtb and crest installation root>"
[clusters.batch.resources]
# Entry defaults are independent; no inheritance from clusters.default.
# default_tier = "mini"
# The same optional hard walltime is supported for Slurm.
# max_walltime = "24:00:00"
# Example limits only; replace with the intended local allowance.
# Per-job/tier cap: positive integer, no larger than one eligible node.
# Gaussian runs on one node; size for the smallest eligible node.
# Running + queued cap: integer >= max_cores; no four-times ceiling.
# ag does not limit concurrently running cores.
max_cores = 44
max_committed_cores = 44
# Legacy budget_core_hours is accepted but ignored by submission checks.
# Only the requested maximum core-hours is shown; ledgers still record usage.
[clusters.batch.resources.tiers.mini]
cores = 4
mem_gb = 10
[clusters.batch.resources.tiers.simple]
cores = 8
mem_gb = 12
[clusters.batch.resources.tiers.general]
cores = 22
mem_gb = 50
[clusters.batch.resources.tiers.complex]
cores = 44
mem_gb = 120
# Optional clusters.batch.resources.tiers.max / .ultra use cores and mem_gb.

# A second queue entry for the SAME login: copy the exact SSH config_file and
# host from batch. Different partition/account/qos do not create another cap.
# The shared cap is the minimum max_committed_cores across matching entries.
[clusters.batch-test]
scheduler = "slurm"
partition = "<test partition>"
allowed_templates = ["crest"]
# Omit allowed_templates to allow every reviewed template; [] blocks prepare.
# Already prepared Attempts retain their original binding and hashed script.
[clusters.batch-test.ssh]
config_file = "<absolute SSH configuration file>"
host = "<Slurm SSH alias>"
[clusters.batch-test.remote]
allowed_root = "<absolute allowed root>"
ag_root = "<absolute allowed root>/ag"
[clusters.batch-test.programs.gaussian]
# Required by the existing renderer even when only CREST is allowed.
g16root = "<absolute Gaussian executable directory>"
[clusters.batch-test.programs.xtb]
root = "<absolute xtb and crest installation root>"
[clusters.batch-test.resources]
max_cores = 44
max_committed_cores = 44
[clusters.batch-test.resources.tiers.mini]
cores = 4
mem_gb = 10
[clusters.batch-test.resources.tiers.simple]
cores = 8
mem_gb = 12
[clusters.batch-test.resources.tiers.general]
cores = 22
mem_gb = 50
[clusters.batch-test.resources.tiers.complex]
cores = 44
mem_gb = 120
