# Multiwfn 2026.10.1; manual §§3.23.5–6, 4.20.10–11.
# output_names expands ONLY manifest science.n_frames (1–50), never a remote listing.
# Frames use three digits (001–050); fragment pairs use two digits (01-02).
# All tiers fetch both cubes. fchk and other working files stay in the Attempt.
outputs = ["multiwfn.out", "job.pbs.out"]
frame_outputs = ["frame-{frame:03d}-dg_inter.cub", "frame-{frame:03d}-sl2r.cub"]
pair_outputs = ["frame-{frame:03d}-pair-{left:02d}-{right:02d}.out", "frame-{frame:03d}-pair-{left:02d}-{right:02d}-atmdg.txt", "frame-{frame:03d}-pair-{left:02d}-{right:02d}-IBSIW.txt"]
completion = "AG_NCI_COMPLETE"
[parameters]
"--analysis" = ["igm", "igmh"]
"--grid" = ["low", "medium", "high"]
