outputs = ["crest.out", "crest_conformers.xyz", "crest.energies", "crest_best.xyz"]
mdopt_outputs = ["crest.out", "crest_ensemble.xyz", "ensemble_energies.log"]
completion = "CREST terminated normally."
[parameters]
# Set by prepare --constraints after content validation, never an arbitrary path.
"--cinp" = ["constraints.inp"]
"--mdopt" = "flag"
"--gfn2" = "flag"
"--nci" = "flag"
"--gfnff" = "flag"
"--quick" = "flag"
"--squick" = "flag"
"--mquick" = "flag"
"--alpb" = ["water", "methanol", "ethanol", "acetone", "acetonitrile", "benzene", "toluene", "ch2cl2", "chloroform", "thf", "dmso", "ether", "hexane"]
"--chrg" = "integer"
"--uhf" = "nonnegative_integer"
"--ewin" = "positive_number"
