# Replace placeholders locally; never commit the populated configuration.
[ssh]
config_file = "<absolute SSH configuration file>"
host = "<SSH host alias>"
[remote]
allowed_root = "<absolute SDL root>"
ag_root = "<absolute SDL root>/ag"
[scheduler]
queue = "<queue>"
[resources]
# Per-job and tier cap: positive integer, sized for one eligible node.
# Running + queued cap: integer >= max_cores; defaults to max_cores.
# Optional queue cap includes held jobs and unobserved reservations.
# Optional scheduler running cap is advisory; admins must enforce it.
# ag does not set or verify a scheduler runtime cap.
max_cores = 44
# PBS-only, owner-authorized per-entry memory ceiling: integer 120..200 GB.
# Omitted: 120 GB. Each tier stays at or below the configured ceiling.
# This does not verify node capacity or scheduler/account permission.
# pbs_max_mem_gb = 200
# Optional hard per-job walltime; positive HH:MM:SS, 2..4 hour digits.
# Omitted: no extra ag limit; the scheduler may still impose one.
# max_walltime = "36:00:00"
# max_committed_cores = 264
# max_queued_cores = 198
# scheduler_max_running_cores = 66
[resources.tiers.mini]
cores = 4
mem_gb = 10
[resources.tiers.simple]
cores = 8
mem_gb = 12
[resources.tiers.general]
cores = 22
mem_gb = 50
[resources.tiers.complex]
cores = 44
mem_gb = 120
# Optional resources.tiers.max / resources.tiers.ultra use cores and mem_gb.
# Only configure tiers supported by one eligible node and approved local caps.
[programs.gaussian]
g16root = "<absolute Gaussian executable directory>"
[programs.xtb]
root = "<absolute xtb and crest installation root>"
# Optional independent CREST executable; otherwise uses the root above/bin/crest.
# [programs.crest]
# executable = "<absolute CREST executable>"
[local]
python = "<absolute chem Python executable>"
studies_root = "<absolute local studies directory outside Git>"
