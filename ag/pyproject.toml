[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag"
version = "4.7.1"
description = "Auto-Gaussian command-line tools"
requires-python = ">=3.11"

[project.scripts]
ag = "ag.cli:main"

[project.optional-dependencies]
test = ["pytest~=9.1.1"]
chem = ["cclib~=1.8.1", "goodvibes==4.3.0", "numpy~=2.4.6"]

[tool.setuptools.packages.find]
where = ["src"]
